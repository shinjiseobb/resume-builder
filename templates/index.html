<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 이력서 & 포트폴리오 빌더</title>
    <!-- 파일을 직접 열었을 때 자동으로 서버 주소로 이동시키는 스마트 리다이렉트 -->
    <script>
        if (window.location.protocol === "file:") {
            window.location.href = "http://127.0.0.1:5000";
        }
    </script>
    <!-- 마크다운 렌더링 라이브러리 (marked.js) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- CSS 스타일시트 연결 -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 영역 -->
        <header class="app-header">
            <h1>🚀 AI Resume & Portfolio Builder</h1>
            <p class="subtitle">기본 정보를 입력하면 Gemini AI가 쉬었음 청년을 탈출하게 해드립니다.</p>
        </header>

        <!-- 메인 입력 폼 -->
        <main class="content-wrapper">
            <section class="form-section">
                <form id="resume-form" novalidate>
                    <!-- 0. 원클릭 샘플 데이터 선택 버튼 -->
                    <div class="preset-section">
                        <label class="section-title">⚡ 빠른 샘플 데이터 불러오기</label>
                        <p class="preset-desc">원하는 직무 샘플을 클릭하면 입력창이 자동으로 채워집니다.</p>
                        <div class="preset-buttons">
                            <button type="button" class="preset-btn" data-preset="pm_designer">🎨 서비스기획/마케터 (오렌지 템플릿)</button>
                            <button type="button" class="preset-btn" data-preset="developer">💻 테크 개발자 (블루 템플릿)</button>
                            <button type="button" class="preset-btn" data-preset="business">💼 경영지원/사무직 (클래식 템플릿)</button>
                        </div>
                    </div>

                    <!-- 1. 디자인 템플릿 선택 -->
                    <div class="form-group">
                        <label class="section-title">🎨 이력서 디자인 템플릿</label>
                        <div class="template-selector">
                            <label class="template-card">
                                <input type="radio" name="design_template" value="template-warm" checked>
                                <div class="template-preview warm-preview">
                                    <span class="preview-badge">스크린샷 스타일</span>
                                    <strong>모던 웜 (오렌지)</strong>
                                    <span>따뜻한 골드/오렌지 포인트 & 부드러운 카드형</span>
                                </div>
                            </label>
                            <label class="template-card">
                                <input type="radio" name="design_template" value="template-tech">
                                <div class="template-preview tech-preview">
                                    <span class="preview-badge">IT/개발자 추천</span>
                                    <strong>테크 미니멀 (블루)</strong>
                                    <span>슬레이트 블루 & 기술 역량 강조형</span>
                                </div>
                            </label>
                            <label class="template-card">
                                <input type="radio" name="design_template" value="template-classic">
                                <div class="template-preview classic-preview">
                                    <span class="preview-badge">비즈니스 정통</span>
                                    <strong>클래식 (차콜/네이비)</strong>
                                    <span>단정하고 신뢰감을 주는 전통 문서 서식</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- 2. 기본 정보 입력 -->
                    <div class="form-group">
                        <label for="name">성명 <span class="required">*</span></label>
                        <input type="text" id="name" name="name" placeholder="예: 홍길동" required>
                    </div>

                    <div class="form-group">
                        <label for="job_role">지원 직무 <span class="required">*</span></label>
                        <input type="text" id="job_role" name="job_role" placeholder="예: 백엔드 개발자, 데이터 엔지니어, 프로덕트 매니저" required>
                    </div>

                    <!-- 3. 경력 및 프로젝트 입력 -->
                    <div class="form-group">
                        <label for="experience">주요 경력 사항 <span class="required">*</span></label>
                        <textarea id="experience" name="experience" rows="5" placeholder="근무했던 회사명, 재직 기간, 담당했던 핵심 업무 등을 자유롭게 작성하세요." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="projects">프로젝트 경험 및 성과 <span class="required">*</span></label>
                        <textarea id="projects" name="projects" rows="6" placeholder="진행했던 주요 프로젝트명, 사용 기술, 본인의 구체적 역할과 달성한 성과를 적어주세요." required></textarea>
                    </div>

                    <!-- 4. 어조(Tone) 선택 -->
                    <div class="form-group">
                        <label for="tone">문체 및 어조 (Tone)</label>
                        <select id="tone" name="tone">
                            <option value="전문적이고 신뢰감을 주는">전문적이고 신뢰감을 주는 (추천)</option>
                            <option value="자신감 넘치고 주도적인">자신감 넘치고 주도적인</option>
                            <option value="진솔하고 담백한">진솔하고 담백한</option>
                            <option value="논리적이고 분석적인">논리적이고 분석적인</option>
                        </select>
                    </div>

                    <!-- 5. 프롬프트 모드 선택 (Prompt A vs Prompt B) -->
                    <div class="form-group">
                        <label class="section-title">작성 모드 선택</label>
                        <div class="radio-group">
                            <label class="radio-card">
                                <input type="radio" name="prompt_type" value="prompt_a" checked>
                                <div class="card-content">
                                    <strong>Prompt A: 일반 모드</strong>
                                    <span>가독성이 좋고 읽기 편한 표준 서식의 균형 잡힌 초안</span>
                                </div>
                            </label>
                            <label class="radio-card">
                                <input type="radio" name="prompt_type" value="prompt_b">
                                <div class="card-content">
                                    <strong>Prompt B: 전문가 모드</strong>
                                    <span>STAR 기법 적용 및 수치화된 성과를 극대화하는 강력한 초안</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- 생성 버튼 -->
                    <div class="form-actions">
                        <button type="submit" id="generate-btn" class="btn primary-btn">
                            ✨ AI 이력서 & 포트폴리오 생성하기
                        </button>
                    </div>
                </form>

                <!-- 에러 메시지 알림 상자 (기본 숨김) -->
                <div id="error-box" class="alert-box error hidden" role="alert"></div>
            </section>

            <!-- 결과 표시 섹션 -->
            <section class="result-section">
                <!-- 로딩 표시기 (기본 숨김) -->
                <div id="loading-spinner" class="loading-container hidden">
                    <div class="spinner"></div>
                    <p class="loading-text">Gemini AI가 이력서와 포트폴리오를 작성 중입니다...<br>잠시만 기다려 주세요 (약 5~15초 소요)</p>
                </div>

                <!-- 안내 플레이스홀더 (결과 나오기 전) -->
                <div id="placeholder-box" class="placeholder-container">
                    <div class="placeholder-icon">📄</div>
                    <h3>작성된 이력서가 여기에 표시됩니다</h3>
                    <p>왼쪽 양식을 입력하고 생성 버튼을 누르면 인공지능이 멋진 초안을 만들어 드립니다.</p>
                </div>

                <!-- 실제 AI 생성 결과창 (기본 숨김) -->
                <div id="result-box" class="result-container hidden">
                    <div class="result-header">
                        <h2>📋 생성된 이력서 & 포트폴리오</h2>
                        <div class="action-buttons">
                            <button type="button" id="copy-btn" class="btn secondary-btn">📋 텍스트 복사</button>
                            <button type="button" id="download-btn" class="btn secondary-btn">💾 .md 다운로드</button>
                        </div>
                    </div>
                    <!-- 마크다운 렌더링 결과 표시 영역 -->
                    <div id="result-content" class="result-content markdown-body"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- JavaScript 로직 연결 -->
    <script src="/static/js/app.js"></script>
</body>
</html>
